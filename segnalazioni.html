<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🔧 Segnalazioni — Virgilio 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf3f3;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(160deg, #4a0000 0%, #c62828 55%, #ef5350 100%);
      color: white;
      padding: 36px 20px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.10), transparent),
        radial-gradient(ellipse 50% 35% at 80% 70%, rgba(255,255,255,0.07), transparent);
    }

    .back-link {
      position: absolute; top: 14px; left: 14px;
      background: rgba(255,255,255,0.18); border-radius: 20px;
      padding: 7px 15px; font-size: 0.76rem; font-weight: 700;
      color: white; text-decoration: none; z-index: 2;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .back-link:hover { background: rgba(255,255,255,0.30); }

    .header .icons { font-size: 3rem; display: block; margin-bottom: 10px; line-height: 1; position: relative; }
    .header h1 {
      font-size: 1.6rem; font-weight: 800; letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2); position: relative;
    }
    .header .subtitle {
      font-size: 0.82rem; opacity: 0.9; margin-top: 6px;
      font-weight: 500; letter-spacing: 0.3px; position: relative;
    }

    .sync-status {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 0.7rem; margin-top: 12px; opacity: 0.92; position: relative;
    }
    .sync-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #fff; animation: blink 1.5s infinite; flex-shrink: 0;
    }
    .sync-dot.connected { background: #a5d6a7; animation: none; }
    .sync-dot.error     { background: #ef9a9a; animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    .wave-divider {
      display: block; line-height: 0; overflow: hidden;
      background: linear-gradient(160deg, #4a0000 0%, #c62828 55%, #ef5350 100%);
    }
    .wave-divider svg { display: block; width: 100%; }

    .container { max-width: 520px; margin: 0 auto; padding: 16px 12px 60px; }

    /* ── FORM ── */
    .report-form {
      background: white; border-radius: 18px; padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 22px rgba(198,40,40,0.10);
      border: 2px solid #ffcdd2;
    }
    .report-form h3 {
      font-size: 0.76rem; color: #c62828;
      text-transform: uppercase; letter-spacing: 0.9px;
      font-weight: 800; margin-bottom: 12px;
    }

    .form-group { margin-bottom: 10px; }
    .form-label { font-size: 0.72rem; font-weight: 700; color: #6d4c41; margin-bottom: 4px; display: block; }

    .form-input, .form-textarea, .form-select {
      width: 100%; border: 2px solid #ffcdd2; border-radius: 10px;
      padding: 10px 13px; font-size: 0.88rem; outline: none;
      color: #333; transition: border-color 0.2s; font-family: inherit;
      background: #fffafa; appearance: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: #c62828; background: #fff; }
    .form-textarea { min-height: 90px; resize: vertical; }
    .char-counter { font-size: 0.65rem; color: #bcaaa4; text-align: right; margin-top: 3px; }
    .name-hint { font-size: 0.71rem; color: #90a4ae; margin-top: 6px; line-height: 1.5; }

    .priority-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    .priority-btn {
      border: 2px solid #ffcdd2; border-radius: 10px;
      padding: 9px 6px; font-size: 0.74rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      background: white; text-align: center; color: #888;
    }
    .priority-btn.selected-bassa  { background: #e8f5e9; border-color: #66bb6a; color: #2e7d32; }
    .priority-btn.selected-media  { background: #fff8e1; border-color: #ffb300; color: #e65100; }
    .priority-btn.selected-alta   { background: #ffebee; border-color: #ef5350; color: #b71c1c; }

    .submit-btn {
      width: 100%; border: none; border-radius: 10px;
      padding: 11px 14px; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      background: linear-gradient(135deg, #c62828, #ef5350);
      color: white;
      box-shadow: 0 3px 12px rgba(198,40,40,0.25);
      margin-top: 4px;
    }
    .submit-btn:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── FILTRI ── */
    .filter-row {
      display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .filter-btn {
      border: 2px solid #ffcdd2; border-radius: 20px;
      padding: 6px 14px; font-size: 0.72rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      background: white; color: #888;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #c62828, #ef5350);
      color: white; border-color: transparent;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.76rem; font-weight: 800; color: #c62828;
      text-transform: uppercase; letter-spacing: 1px;
      margin: 4px 0 10px 2px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 2px;
      background: linear-gradient(90deg, #ffcdd2 0%, transparent 100%);
      border-radius: 2px;
    }

    /* ── SEGNALAZIONE CARD ── */
    .report-card {
      background: white; border-radius: 16px;
      padding: 14px 16px; margin-bottom: 10px;
      box-shadow: 0 2px 12px rgba(198,40,40,0.07);
      border: 2px solid #ffebee;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .report-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(198,40,40,0.12); }
    .report-card.mine { border-color: #ef9a9a; background: linear-gradient(135deg, #fffafa 0%, #fff5f5 100%); }

    .report-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 8px; margin-bottom: 8px;
    }
    .report-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .report-author { font-size: 0.82rem; font-weight: 800; color: #c62828; }
    .me-tag {
      font-size: 0.60rem; background: #ffcdd2; color: #b71c1c;
      padding: 1px 6px; border-radius: 8px; font-weight: 700;
    }
    .report-time { font-size: 0.65rem; color: #bcaaa4; font-weight: 500; }

    .report-actions { display: flex; align-items: center; gap: 5px; }
    .resolve-btn {
      background: none; border: 2px solid #a5d6a7; cursor: pointer;
      font-size: 0.70rem; color: #2e7d32; padding: 3px 9px;
      border-radius: 8px; transition: all 0.2s; font-weight: 700;
      white-space: nowrap;
    }
    .resolve-btn:hover { background: #e8f5e9; }
    .resolve-btn.resolved { background: #e8f5e9; border-color: #66bb6a; }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.80rem; color: #ef9a9a; padding: 3px 7px;
      border-radius: 8px; transition: background 0.2s, color 0.2s;
    }
    .delete-btn:hover { background: #ffebee; color: #c62828; }

    .report-title {
      font-size: 0.92rem; font-weight: 700; color: #333;
      margin-bottom: 4px; line-height: 1.35;
    }
    .report-desc {
      font-size: 0.80rem; color: #555; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word; margin-bottom: 8px;
    }

    .tag-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 0.62rem; font-weight: 700; padding: 3px 9px;
      border-radius: 10px; display: inline-flex; align-items: center; gap: 3px;
    }
    .tag-zona    { background: #e3f2fd; color: #0277bd; }
    .tag-bassa   { background: #e8f5e9; color: #2e7d32; }
    .tag-media   { background: #fff8e1; color: #e65100; }
    .tag-alta    { background: #ffebee; color: #b71c1c; }
    .tag-risolta { background: #f3e5f5; color: #6a1b9a; }
    .tag-aperta  { background: #fce4ec; color: #880e4f; }

    .empty-state {
      text-align: center; padding: 36px 16px;
      color: #bcaaa4; font-size: 0.82rem; line-height: 1.8;
    }
    .empty-state .emoji { font-size: 2.6rem; display: block; margin-bottom: 10px; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #b71c1c; color: white;
      padding: 10px 22px; border-radius: 24px;
      font-size: 0.83rem; font-weight: 600;
      transition: transform 0.3s ease; z-index: 999;
      white-space: nowrap; max-width: calc(100vw - 32px);
      box-shadow: 0 6px 24px rgba(183,28,28,0.4);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .page-footer {
      text-align: center; font-size: 0.7rem; color: #bcaaa4;
      padding: 6px 0 20px; letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">&#8592; Home</a>
  <span class="icons">🔧</span>
  <h1>Segnalazioni</h1>
  <div class="subtitle">Segnala guasti o problemi nelle aree comuni</div>
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connessione in corso…</span>
  </div>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#fdf3f3"/>
    <path d="M0,50 C220,18 440,66 660,46 C880,26 1100,62 1320,44 L1440,50 L1440,72 L0,72 Z" fill="#fdf3f3" opacity="0.55"/>
  </svg>
</div>

<div class="container">

  <!-- Form nuova segnalazione -->
  <div class="report-form">
    <h3>🔧 Nuova segnalazione</h3>

    <div class="form-group">
      <label class="form-label">👤 Il tuo nome</label>
      <input class="form-input" type="text" id="user-name"
             placeholder="Es. Marco, Giulia…" maxlength="30"
             autocomplete="off" spellcheck="false"/>
      <div class="name-hint">Il tuo nome viene ricordato automaticamente.</div>
    </div>

    <div class="form-group">
      <label class="form-label">📍 Zona / area</label>
      <select class="form-select" id="zona">
        <option value="">— Seleziona zona —</option>
        <option>Scala A</option>
        <option>Scala B</option>
        <option>Parcheggio</option>
        <option>Piscina</option>
        <option>Giardino</option>
        <option>Sala comune</option>
        <option>Ascensore</option>
        <option>Tetto / Terrazza</option>
        <option>Altro</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">📝 Descrizione del problema</label>
      <textarea class="form-textarea" id="report-desc"
                placeholder="Descrivi il problema in modo chiaro…" maxlength="500"></textarea>
      <div class="char-counter" id="char-counter">0 / 500</div>
    </div>

    <div class="form-group">
      <label class="form-label">🚦 Priorità</label>
      <div class="priority-row">
        <button class="priority-btn" data-p="bassa">🟢 Bassa</button>
        <button class="priority-btn" data-p="media">🟡 Media</button>
        <button class="priority-btn" data-p="alta">🔴 Alta</button>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn">🔧 Invia segnalazione</button>
  </div>

  <!-- Filtri -->
  <div class="filter-row">
    <button class="filter-btn active" data-filter="tutte">Tutte</button>
    <button class="filter-btn" data-filter="aperta">🔴 Aperte</button>
    <button class="filter-btn" data-filter="risolta">✅ Risolte</button>
    <button class="filter-btn" data-filter="alta">🚨 Alta priorità</button>
  </div>

  <div class="section-label" id="list-label">🗂️ Segnalazioni</div>
  <div id="reports-container"></div>

</div>

<div class="page-footer">🔧 Segnalazioni Condominiali • Virgilio 1</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU",
    authDomain:        "lista-spesa-b9eb1.firebaseapp.com",
    databaseURL:       "https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "lista-spesa-b9eb1",
    storageBucket:     "lista-spesa-b9eb1.firebasestorage.app",
    messagingSenderId: "468690890938",
    appId:             "1:468690890938:web:048be7f27779d8862d9283"
  });
  const db      = firebase.database();
  const segnRef = db.ref('segnalazioni');

  let reportsData  = {};
  let activeFilter = 'tutte';
  let activePriority = '';

  const nameInput = document.getElementById('user-name');
  const descArea  = document.getElementById('report-desc');
  const zonaSelect= document.getElementById('zona');
  const charCnt   = document.getElementById('char-counter');

  nameInput.value = localStorage.getItem('condoName') || '';
  nameInput.addEventListener('input', () =>
    localStorage.setItem('condoName', nameInput.value.trim())
  );

  descArea.addEventListener('input', () =>
    charCnt.textContent = `${descArea.value.length} / 500`
  );

  /* priorità */
  document.querySelectorAll('.priority-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activePriority = btn.dataset.p;
      document.querySelectorAll('.priority-btn').forEach(b => b.className = 'priority-btn');
      btn.classList.add(`selected-${activePriority}`);
    });
  });

  /* filtri */
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  /* Firebase */
  db.ref('.info/connected').on('value', snap => {
    const dot = document.getElementById('sync-dot');
    const lbl = document.getElementById('sync-label');
    if (snap.val()) {
      dot.className   = 'sync-dot connected';
      lbl.textContent = '🟢 Sincronizzato in tempo reale';
    } else {
      dot.className   = 'sync-dot error';
      lbl.textContent = '🔴 Offline — riconnessione…';
    }
  });

  segnRef.on('value', snap => {
    reportsData = snap.val() || {};
    render();
  });

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function myName()   { return nameInput.value.trim(); }
  function myNameLc() { return myName().toLowerCase(); }

  function formatDate(ts) {
    const diff = Date.now() - ts;
    if (diff < 60000)    return 'Ora';
    if (diff < 3600000)  return `${Math.floor(diff/60000)} min fa`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)} ore fa`;
    if (diff < 172800000) return 'Ieri';
    const d = new Date(ts);
    return d.toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
  }

  function priorityLabel(p) {
    if (p === 'alta')  return '🔴 Alta';
    if (p === 'media') return '🟡 Media';
    return '🟢 Bassa';
  }

  function render() {
    const container = document.getElementById('reports-container');
    let entries = Object.entries(reportsData).sort(([,a],[,b]) => b.ts - a.ts);

    if (activeFilter === 'aperta')  entries = entries.filter(([,r]) => !r.risolta);
    if (activeFilter === 'risolta') entries = entries.filter(([,r]) => r.risolta);
    if (activeFilter === 'alta')    entries = entries.filter(([,r]) => r.priorita === 'alta');

    document.getElementById('list-label').textContent =
      `🗂️ Segnalazioni (${entries.length})`;

    if (entries.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <span class="emoji">✅</span>
          Nessuna segnalazione${activeFilter !== 'tutte' ? ' in questa categoria' : ''}.<br>
          ${activeFilter === 'tutte' ? 'Il condominio è a posto! 🎉' : ''}
        </div>`;
      return;
    }

    container.innerHTML = entries.map(([id, r]) => {
      const isMe    = myName() && r.autore.toLowerCase() === myNameLc();
      const risolta = !!r.risolta;
      return `
        <div class="report-card${isMe ? ' mine' : ''}">
          <div class="report-header">
            <div class="report-meta">
              <span class="report-author">${esc(r.autore)}</span>
              ${isMe ? '<span class="me-tag">Tu</span>' : ''}
              <span class="report-time">• ${formatDate(r.ts)}</span>
            </div>
            <div class="report-actions">
              ${isMe ? `
                <button class="resolve-btn${risolta ? ' resolved' : ''}" data-id="${id}" data-risolta="${risolta}">
                  ${risolta ? '✅ Risolta' : 'Segna risolta'}
                </button>
                <button class="delete-btn" data-id="${id}" title="Elimina">🗑️</button>
              ` : (risolta ? '<span class="tag tag-risolta">✅ Risolta</span>' : '')}
            </div>
          </div>
          <div class="report-desc">${esc(r.desc)}</div>
          <div class="tag-row">
            ${r.zona ? `<span class="tag tag-zona">📍 ${esc(r.zona)}</span>` : ''}
            <span class="tag tag-${r.priorita}">${priorityLabel(r.priorita)}</span>
            ${!isMe ? '' : ''}
            ${!risolta && !isMe ? '<span class="tag tag-aperta">🔴 Aperta</span>' : ''}
          </div>
        </div>`;
    }).join('');

    container.querySelectorAll('.resolve-btn').forEach(btn =>
      btn.addEventListener('click', () => {
        const wasRisolta = btn.dataset.risolta === 'true';
        segnRef.child(btn.dataset.id).update({ risolta: !wasRisolta });
        showToast(wasRisolta ? '🔄 Segnalazione riaperta' : '✅ Segnata come risolta!');
      })
    );
    container.querySelectorAll('.delete-btn').forEach(btn =>
      btn.addEventListener('click', () => {
        if (confirm('Eliminare questa segnalazione?')) {
          segnRef.child(btn.dataset.id).remove();
          showToast('🗑️ Segnalazione eliminata');
        }
      })
    );
  }

  document.getElementById('submit-btn').addEventListener('click', () => {
    if (!myName()) { highlight(nameInput); showToast('⚠️ Inserisci il tuo nome!'); return; }
    if (!zonaSelect.value) { highlight(zonaSelect); showToast('⚠️ Seleziona la zona!'); return; }
    const desc = descArea.value.trim();
    if (!desc) { highlight(descArea); showToast('⚠️ Descrivi il problema!'); return; }
    if (!activePriority) { showToast('⚠️ Scegli la priorità!'); return; }

    segnRef.push({
      autore:   myName(),
      zona:     zonaSelect.value,
      desc,
      priorita: activePriority,
      risolta:  false,
      ts:       Date.now()
    });

    zonaSelect.value = '';
    descArea.value   = '';
    charCnt.textContent = '0 / 500';
    activePriority = '';
    document.querySelectorAll('.priority-btn').forEach(b => b.className = 'priority-btn');
    showToast('✅ Segnalazione inviata!');
  });

  function highlight(el) {
    el.focus();
    el.style.borderColor = '#ef5350';
    setTimeout(() => el.style.borderColor = '#ffcdd2', 1800);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }
</script>
</body>
</html>
